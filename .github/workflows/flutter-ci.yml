name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    name: Bootstrap mobile targets, format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and iOS runner projects once
        run: |
          if [ ! -d android ] || [ ! -d ios ]; then
            flutter create --platforms=android,ios --org dev.nimbus --project-name nimbus /tmp/nimbus_mobile_scaffold
            cp -R /tmp/nimbus_mobile_scaffold/android ./android
            cp -R /tmp/nimbus_mobile_scaffold/ios ./ios
            cp /tmp/nimbus_mobile_scaffold/.metadata ./.metadata
          fi
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format Dart source
        run: dart format .
      - name: Commit bootstrap files and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios .metadata lib test pubspec.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: add mobile runners and format Dart source"
            git push
          fi
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test --reporter expanded
